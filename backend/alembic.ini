# Alembic configuration for NoteMint.
# Run from the backend/ directory:  python -m alembic <command>

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is intentionally empty: alembic/env.py reads DATABASE_URL /
# DIRECT_DATABASE_URL from application settings (never hardcode credentials).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
